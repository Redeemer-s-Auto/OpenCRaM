worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  # After a release, a cached index.html points at deleted /assets/ files and the app hangs on the
  # logo. The HTML must be revalidated every time; hashed assets never change and cache for a year.
  map $uri $notes_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
  }

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control $notes_cache_control;

    # A missing hashed asset is a 404, never index.html (which would be cached as the asset).
    location /assets/ {
      root   /usr/share/nginx/html;
      try_files $uri =404;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}

