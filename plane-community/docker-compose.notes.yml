# Redeemer's Auto Notes overrides, layered on docker-compose.garden.yml:
#   docker compose --env-file <env> -f docker-compose.garden.yml -f docker-compose.notes.yml ...
#
# GARDEN_AUTH_ENABLED (API) and VITE_GARDEN_AUTH_ENABLED (web build) must agree.
# The Garden file hard-codes the web build arg to "1"; this reads it from the env
# file so a deployment can run with Plane's own sign-in until its Firebase bridge
# is configured.
services:
  # The Garden healthcheck (/auth/firebase/health/) returns 503 unless
  # GARDEN_AUTH_ENABLED=1 and a Firebase credential exists. NOTES_API_HEALTH_PATH
  # lets a deployment without the bridge use Plane's own health route ("/").
  api:
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000' + os.environ.get('NOTES_API_HEALTH_PATH', '/auth/firebase/health/'), timeout=4).read()",
        ]
    environment:
      NOTES_API_HEALTH_PATH: ${NOTES_API_HEALTH_PATH:-/auth/firebase/health/}

  web:
    build:
      args:
        VITE_GARDEN_AUTH_ENABLED: ${GARDEN_AUTH_ENABLED:-1}
        VITE_WEBSITE_URL: ${NOTES_WEBSITE_URL:-https://redeemersauto.com}

  proxy:
    environment:
      GARDEN_EMBED_ORIGIN: ${GARDEN_EMBED_ORIGIN:?Set GARDEN_EMBED_ORIGIN}
